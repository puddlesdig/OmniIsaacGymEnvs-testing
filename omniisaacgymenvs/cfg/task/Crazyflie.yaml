# used to create the object / select this task via: task=Crazyflie
name: Crazyflie

# inherit the chosen physics engine from the parent config
physics_engine: ${..physics_engine}

env:
  # Defaults to CLI override (num_envs); otherwise falls back to 4096.
  numEnvs: ${resolve_default:4096,${...num_envs}}
  # spacing between envs in the grid
  envSpacing: 2.5
  # length of an episode in simulation steps (dt*steps seconds)
  # 1000 @ dt=0.01 → 10 seconds (gives the agent time to lift and stabilize)
  maxEpisodeLength: 1000
  enableDebugVis: False

  # Clamp observations/actions fed to the policy (safety + stability)
  clipObservations: 5.0
  clipActions: 1.0

sim:
  # 0.01 → 100 Hz physics
  dt: 0.01
  # use GPU pipeline when the top-level pipeline=gpu (pass via CLI)
  use_gpu_pipeline: ${eq:${...pipeline},"gpu"}
  gravity: [0.0, 0.0, -9.81]
  add_ground_plane: True
  add_distant_light: False
  use_fabric: True
  enable_scene_query_support: False
  # set to True if you use camera sensors in the environment
  enable_cameras: False
  disable_contact_processing: False

  physx:
    # threads/solver type come from the parent (e.g., physx defaults)
    num_threads: ${....num_threads}
    solver_type: ${....solver_type}
    # run PhysX on GPU if sim_device=cuda:0 (pass via CLI)
    use_gpu: ${eq:${....sim_device},"gpu"}
    solver_position_iteration_count: 6
    solver_velocity_iteration_count: 0
    contact_offset: 0.02
    rest_offset: 0.001
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 1000.0
    friction_offset_threshold: 0.04
    friction_correlation_distance: 0.025
    enable_sleeping: True
    enable_stabilization: False

    # GPU buffer sizes (defaults from the original file; keep generous for many envs)
    gpu_max_rigid_contact_count: 524288
    gpu_max_rigid_patch_count: 81920
    gpu_found_lost_pairs_capacity: 4194304
    gpu_found_lost_aggregate_pairs_capacity: 33554432
    gpu_total_aggregate_pairs_capacity: 4194304
    gpu_max_soft_body_contacts: 1048576
    gpu_max_particle_contacts: 1048576
    gpu_heap_capacity: 67108864
    gpu_temp_buffer_capacity: 16777216
    gpu_max_num_partitions: 8

  # Per-actor simulation overrides (optional; keep as in the stock config)

  crazyflie:
    # -1 to use USD defaults
    override_usd_defaults: False
    enable_self_collisions: True
    enable_gyroscopic_forces: True

    # per-actor settings
    solver_position_iteration_count: 6
    solver_velocity_iteration_count: 0
    sleep_threshold: 0.005
    stabilization_threshold: 0.001

    # per-body settings
    density: -1
    max_depenetration_velocity: 1000.0

  ball:
    # Kinematic visualization target at the hover point (no collisions)
    override_usd_defaults: False
    make_kinematic: True
    enable_self_collisions: False
    enable_gyroscopic_forces: True

    # per-actor settings
    solver_position_iteration_count: 6
    solver_velocity_iteration_count: 0
    sleep_threshold: 0.005
    stabilization_threshold: 0.001

    # per-body settings
    density: -1
    max_depenetration_velocity: 1000.0
